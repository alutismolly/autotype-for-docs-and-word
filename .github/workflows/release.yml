name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: python -m json.tool manifest.json > /dev/null

      - name: Build ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/autotype-for-docs-and-word-${GITHUB_REF_NAME}.zip" \
            manifest.json background.js popup.html popup.css popup.js icons \
            LICENSE PRIVACY.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/autotype-for-docs-and-word-${{ github.ref_name }}.zip
